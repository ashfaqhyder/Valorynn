{% extends "base.html" %}
{% block title %}Add application · Valorynn{% endblock %}
{% block content %}
<section class="form-shell"><div><p class="eyebrow">APP INVENTORY</p><h1>Add an authorized application</h1><p>Targets must be public HTTP(S) addresses. Valorynn blocks local, private, and reserved networks before scanning.</p></div><form class="card wide-form" action="/applications" method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Application name<input name="name" maxlength="120" placeholder="My student portal" required></label><label>Authorized target URL<input type="url" name="target_url" placeholder="https://example.com" required></label><label>Git repository export URL <span class="hint">optional, recorded for reference only</span><input type="url" name="repository_url" placeholder="https://github.com/you/project"></label><label>Source ZIP <span class="hint">optional, 5 MB maximum</span><input type="file" name="source_zip" accept=".zip"><small>The archive is checked only to create private file metadata, then discarded. Upload it again when you want source review in a scan—this avoids retaining possible keys in your code.</small></label><button type="submit">Save application</button></form></section>
{% endblock %}
