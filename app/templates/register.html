{% extends "base.html" %}

{% block title %}Create Account — Valorynn{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 500px;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <div class="valorynn-logo-container" style="width: 56px; height: 56px; margin: 0 auto 1.5rem;">
        <svg class="valorynn-logo" viewBox="0 0 100 100" width="56" height="56">
          <g class="logo-element">
            <circle cx="50" cy="50" r="40" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="50" y1="15" x2="50" y2="85" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="15" y1="50" x2="85" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.5rem;">Start securing your applications</h1>
      <p style="color: var(--text-secondary); font-size: 0.95rem;">Create a Valorynn account to begin</p>
    </div>

    <form method="post" action="/register">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label for="name" class="form-label">Full Name or Username</label>
        <input type="text" id="name" name="name" required autofocus class="form-control" placeholder="Alex Rivera">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" required class="form-control" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" minlength="10" required class="form-control" placeholder="Minimum 10 characters">
        <p style="font-size: 0.8rem; color: var(--text-tertiary); margin-top: 0.35rem;">Stored securely using scrypt salted hashing</p>
      </div>

      <div class="form-group">
        <label for="account_type" class="form-label">Account Type</label>
        <select id="account_type" name="account_type" required class="form-control">
          <option value="student">Student</option>
          <option value="developer">Individual / Developer</option>
          <option value="organization">Organization</option>
        </select>
      </div>

      <div id="studentFields" style="display: none;">
        <div class="form-group">
          <label for="institution" class="form-label">Institution / University</label>
          <input type="text" id="institution" name="institution" class="form-control" placeholder="University of Technology">
        </div>

        <div class="form-group">
          <label for="course_year" class="form-label">Course / Year</label>
          <input type="text" id="course_year" name="course_year" class="form-control" placeholder="Computer Science - Year 3">
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">
        Create Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
      <p style="color: var(--text-secondary); font-size: 0.95rem;">
        Already have an account? <a href="/signin" style="color: var(--text-primary); font-weight: 600; text-decoration: none;">Sign in</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}
