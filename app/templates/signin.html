{% extends "base.html" %}
{% from "partials/brand.html" import brand_lockup %}

{% block title %}Sign In — Valorynn{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-intro">
      {{ brand_lockup("auth-brand") }}
      <h1>Welcome back</h1>
      <p style="color: var(--text-secondary); font-size: 0.95rem;">Sign in to your Valorynn account</p>
    </div>

    <form method="post" action="/signin" data-pending-label="Signing in…">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" required autofocus class="form-control" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" required class="form-control" placeholder="Enter your password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;" data-idle-label="Sign In">
        Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
      <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1rem;">
        Don't have an account? <a href="/register" style="color: var(--text-primary); font-weight: 600; text-decoration: none;">Create one now</a>
      </p>
    </div>
  </div>
</div>

{% endblock %}
