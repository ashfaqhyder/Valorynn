services:
  valorynn:
    build: .
    ports:
      - "8000:8000"
    environment:
      VALORYNN_SECRET_KEY: ${VALORYNN_SECRET_KEY:?Set VALORYNN_SECRET_KEY in .env}
      VALORYNN_DATABASE_PATH: /data/valorynn.sqlite3
      VALORYNN_COOKIE_SECURE: ${VALORYNN_COOKIE_SECURE:-true}
      VALORYNN_ENV: ${VALORYNN_ENV:-production}
    volumes:
      - valorynn_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  valorynn_data:
