[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "valorynn"
version = "0.2.1"
description = "Authorized application security assessments with explainable scoring."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.28,<0.29",
  "httpcore>=1.0.9,<1.1",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
  "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
